name: ${DEVC2_PROJECT_NAME:?set DEVC2_PROJECT_NAME}
services:
  devbox:
    build:
      context: ${DEVC2_INSTALL_DIR:?set DEVC2_INSTALL_DIR}
      dockerfile: Dockerfile
      labels:
        dev.devc2.asset-digest: ${DEVC2_ASSET_DIGEST:-development}
    image: ${DEVC2_IMAGE:-devc2:local}
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      HOME: /home/devbox
      TACT_HOME: /home/devbox/.local/share/tact
      TACT_CONFIG: /home/devbox/.local/share/tact/config.toml
      TACT_WORKSPACE: /workspace
      DB_HOST: ${DEVC2_DB_HOST:-postgres-primary.internal}
      DB_PORT: ${DEVC2_DB_PORT:-5432}
      DB_NAME: ${DEVC2_DB_NAME:-app}
    env_file:
      - ${DEVC2_WORLD_ENV_FILE:?set DEVC2_WORLD_ENV_FILE}
    volumes:
      - type: bind
        source: ${DEVC2_WORKSPACE:?set DEVC2_WORKSPACE}
        target: /workspace
      - type: bind
        source: ${DEVC2_PUBLIC_DIR:?set DEVC2_PUBLIC_DIR}
        target: /run/devc2-public
        read_only: true
      - type: bind
        source: ${DEVC2_PUBLIC_DIR:?set DEVC2_PUBLIC_DIR}/agent-home
        target: /home/devbox/.agents
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: state-v2
        target: /home/devbox
      - type: bind
        source: ${DEVC2_SPAN_CLIENT_DIR:?set DEVC2_SPAN_CLIENT_DIR}
        target: /run/devc2/bin
        read_only: true
      - type: volume
        source: span-sockets-v2
        target: /run/devc2/spans
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 4096
    mem_limit: 16g
    cpus: 8
    labels:
      dev.devbox.generation: "2"
      dev.devbox.workspace-hash: ${DEVC2_WORKSPACE_HASH:?set DEVC2_WORKSPACE_HASH}

  span-proxy:
    profiles: [spans]
    user: "0:0"
    build:
      context: ${DEVC2_INSTALL_DIR:?set DEVC2_INSTALL_DIR}
      dockerfile: credential_proxy/Dockerfile
      labels:
        dev.devc2.asset-digest: ${DEVC2_ASSET_DIGEST:-development}
    image: ${DEVC2_CREDENTIAL_IMAGE:-devc2-span-proxy:local}
    entrypoint: [python, -m, credential_proxy.span_bridge]
    command:
      - --config
      - /run/devc2-public/spans.json
      - --socket-dir
      - /run/devc2/spans
      - --tls-ca
      - /run/devc2-span-tls/ca.crt
      - --tls-cert
      - /run/devc2-span-tls/client.crt
      - --tls-key
      - /run/devc2-span-tls/client.key
      - --ready-token-file
      - /run/devc2-public/span-ready
      - --http-config
      - /run/devc2-public/http-routes.json
      - --http-port
      - "3128"
    init: true
    volumes:
      - type: bind
        source: ${DEVC2_SPAN_RELAY_TLS_DIR:?set DEVC2_SPAN_RELAY_TLS_DIR}
        target: /run/devc2-span-tls
        read_only: true
      - type: bind
        source: ${DEVC2_PUBLIC_DIR:?set DEVC2_PUBLIC_DIR}
        target: /run/devc2-public
        read_only: true
      - type: volume
        source: span-sockets-v2
        target: /run/devc2/spans
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    labels:
      dev.devbox.generation: "2"

volumes:
  state-v2:
    labels:
      dev.devbox.generation: "2"
      dev.devbox.workspace-hash: ${DEVC2_WORKSPACE_HASH:?set DEVC2_WORKSPACE_HASH}
  span-sockets-v2:
    name: ${DEVC2_SPAN_VOLUME:?set DEVC2_SPAN_VOLUME}
    labels:
      dev.devbox.generation: "2"
