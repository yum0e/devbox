name: devc2 release

on:
  push:
    tags: ["devc2-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: devc2-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag and test
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import re
          text=open('v2/launcher/devc2.py').read()
          print(re.search(r'^VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$',text,re.M).group(1))
          PY
          )"
          test "${GITHUB_REF_NAME}" = "devc2-v${version}"
          test "${{ github.ref_protected }}" = "true"
          test "${{ vars.DEVC2_RELEASE_APPROVED }}" = "true"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          PYTHONPATH=v2 python3 -m unittest discover -s v2/tests -v
          PYTHONPATH=v2 python3 -m unittest discover -s v2/credential_proxy/tests -v
          python3 -m py_compile v2/examples/herdr-span/island_supervisor.py
          bash -n v2/install.sh v2/install-release.sh v2/devbox/entrypoint.sh v2/devbox/configure-pi.sh
          bash tests/test_devc_multiplexer.sh
      - name: Build deterministic assets
        run: python3 v2/package-release.py
      - name: Build and smoke-test packaged images
        timeout-minutes: 90
        env:
          DEVC2_TEST_PACKAGED_IMAGES: "1"
        run: PYTHONPATH=v2 python3 -m unittest -v v2.tests.test_packaged_images
      - name: Verify reproducibility and clean install
        shell: bash
        run: |
          set -euo pipefail
          first="$(sha256sum dist/devc2.tar.gz)"
          python3 v2/package-release.py
          test "$first" = "$(sha256sum dist/devc2.tar.gz)"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          tar -xzf dist/devc2.tar.gz -C "$temp"
          HOME="$temp/home" DEVC2_BIN_DIR="$temp/bin" DEVC2_SHARE_DIR="$temp/share" "$temp/devc2/install.sh"
          "$temp/bin/devc2" --version
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/devc2.tar.gz dist/devc2.tar.gz.sha256 dist/install-devc2.sh --verify-tag --generate-notes
